ụp giấy giải viết tay thể hiện số mol H⁺, OH⁻ dư, a và m.",unit:"Giá trị P",hint:"Tính tổng n(H⁺) = 0,04 mol; n(SO₄²⁻) = 0,01 mol. Từ pH = 12 ⇒ [OH⁻]dư = 0,01 M ⇒ n(OH⁻)dư = 0,005 mol. Suy ra tổng n(OH⁻) ban đầu = 0,045 mol ⇒ a và so sánh n(Ba²⁺) với n(SO₄²⁻) để tìm m."},{id:3,code:"11C",name:"Định lượng hỗn hợp muối Ammonium",chapter:"Chương 2: Nitrogen và Sulfur",lesson:"Bài 5: Ammonia và muối Ammonium",rating:1300,statement:["Cho 23,9 gam hỗn hợp rắn X gồm hai muối NH₄Cl và (NH₄)₂SO₄ tác dụng vừa đủ với 200 mL dung dịch Ba(OH)₂ 1,0 M khi đun nóng.","Sau khi phản ứng kết thúc hoàn toàn, toàn bộ khí ammonia thoát ra khỏi dung dịch và thu được m gam kết tủa trắng không tan trong acid mạnh.","Cho nguyên tử khối: H = 1; N = 14; O = 16; S = 32; Cl = 35,5; Ba = 137. Hãy tính giá trị của m."],formulas:["NH₄⁺ + OH⁻ → NH₃↑ + H₂O (t°)","Ba²⁺ + SO₄²⁻ → BaSO₄↓"],inputSpec:"Nhập khối lượng kết tủa m (tính bằng gam) kèm ảnh chụp bài giải viết tay lập hệ phương trình số mol 2 muối.",unit:"gam (g)",hint:"Gọi số mol NH₄Cl là x, số mol (NH₄)₂SO₄ là y. Phản ứng vừa đủ với OH⁻ ⇒ x + 2y = n(OH⁻) = 0,4 mol; mặt khác 53,5x + 132y = 23,9."},{id:4,code:"11D",name:"Quy trình Ostwald sản xuất Nitric Acid",chapter:"Chương 2: Nitrogen và Sulfur",lesson:"Bài 6: Hợp chất của Nitrogen với Oxygen",rating:1300,statement:["Trong công nghiệp, nitric acid (HNO₃) được sản xuất từ ammonia (NH₃) theo quy trình Ostwald qua 3 giai đoạn liên tiếp:","Biết hiệu suất chung của toàn bộ quá trình chuyển hóa từ NH₃ thành HNO₃ đạt 80%.","Để sản xuất được 500 kg dung dịch HNO₃ thương mại có nồng độ 63% (theo khối lượng) thì cần dùng tối thiểu bao nhiêu kilôgam (kg) khí NH₃ nguyên liệu? (Cho H = 1; N = 14; O = 16)."],formulas:["(1) 4NH₃ + 5O₂ → 4NO + 6H₂O (Pt, 850°C)","(2) 2NO + O₂ → 2NO₂","(3) 4NO₂ + O₂ + 2H₂O → 4HNO₃"],inputSpec:"Nhập khối lượng NH₃ cần dùng (đơn vị: kg, viết chính xác đến hai chữ số thập phân) kèm ảnh chụp bài giải bảo toàn nguyên tố Nitrogen.",unit:"kilôgam (kg)",hint:"Tính m(HNO₃ nguyên chất) = 500 × 63% = 315 kg ⇒ n(HNO₃) = 5 kmol. Áp dụng bảo toàn nguyên tố N và chia cho hiệu suất 80% để tìm số kmol NH₃."},{id:5,code:"11E",name:"Biện luận công thức phân tử của Oleum",chapter:"Chương 2: Nitrogen và Sulfur",lesson:"Bài 8: Sulfuric acid và muối Sulfate",rating:1300,statement:["Hòa tan hoàn toàn 8,45 gam một mẫu oleum A có công thức phân tử dạng H₂SO₄·nSO₃ vào nước nguyên chất lấy dư, thu được dung dịch sulfuric acid loãng Y.","Để trung hòa hoàn toàn lượng acid có trong dung dịch Y cần dùng vừa đủ 200 mL dung dịch NaOH 1,0 M.","Cho nguyên tử khối: H = 1; O = 16; S = 32; Na = 23. Hãy xác định giá trị nguyên dương của n trong công thức H₂SO₄·nSO₃."],formulas:["H₂SO₄·nSO₃ + nH₂O → (n + 1)H₂SO₄","H₂SO₄ + 2NaOH → Na₂SO₄ + 2H₂O"],inputSpec:"Nhập giá trị số nguyên n tìm được kèm ảnh chụp lời giải viết tay.",unit:"Chỉ số n",hint:"Số mol H₂SO₄ trong dung dịch Y bằng ½ n(NaOH) = 0,1 mol. Theo bảo toàn nguyên tố S: n(oleum) × (n + 1) = 0,1 mol ⇒ lập phương trình với M(oleum) = 98 + 80n."},{id:6,code:"11F",name:"Bảo toàn Electron với H₂SO₄ đặc nóng",chapter:"Chương 2: Nitrogen và Sulfur",lesson:"Bài 8: Tính oxi hoá mạnh của H₂SO₄ đặc",rating:1400,statement:["Hòa tan hoàn toàn 11,2 gam hỗn hợp kim loại X gồm Cu và Fe vào dung dịch H₂SO₄ đặc, nóng (lấy dư). Sau khi phản ứng xảy ra hoàn toàn, thu được dung dịch Y chỉ chứa hai muối trung hòa CuSO₄, Fe₂(SO₄)₃ và 6,1975 lít khí SO₂ (sản phẩm khử duy nhất, đo ở điều kiện chuẩn 25°C, 1 bar: 1 mol khí chiếm 24,79 lít).","Hãy tính tổng khối lượng hai muối sulfate khan (CuSO₄ và Fe₂(SO₄)₃, tính bằng gam) có trong dung dịch Y sau phản ứng (không tính lượng H₂SO₄ dư). Cho Fe = 56; Cu = 64; S = 32; O = 16."],formulas:["Cu + 2H₂SO₄(đặc) → CuSO₄ + SO₂↑ + 2H₂O","2Fe + 6H₂SO₄(đặc) → Fe₂(SO₄)₃ + 3SO₂↑ + 6H₂O"],inputSpec:"Nhập khối lượng muối khan (đơn vị: gam) kèm ảnh chụp bài giải viết tay (có thể giải bằng hệ phương trình hoặc định luật bảo toàn electron).",unit:"gam (g)",hint:"Tính n(SO₂) = 6,1975 / 24,79 = 0,25 mol. Số mol gốc SO₄²⁻ tạo muối với cation kim loại luôn bằng n(e trao đổi) / 2 = n(SO₂). Suy ra m(muối) = m(kim loại) + m(SO₄²⁻ tạo muối)."},{id:7,code:"11G",name:"Giải mã tín hiệu Phổ hồng ngoại (IR)",chapter:"Chương 3: Đại cương về Hoá học hữu cơ",lesson:"Bài 10: Hợp chất hữu cơ và hoá học hữu cơ (Phổ IR)",rating:1200,statement:["Cho 4 chất hữu cơ đơn chức mạch hở gồm: (X) Propanoic acid (CH₃CH₂COOH); (Y) Methyl acetate (CH₃COOCH₃); (Z) Propanal (CH₃CH₂CHO); và (T) Allyl alcohol (CH₂=CH-CH₂OH).","Khi phân tích phổ hồng ngoại (IR) của 4 mẫu chất trên (được đánh số ngẫu nhiên từ 1 đến 4), người ta ghi nhận các tín hiệu hấp thụ đặc trưng sau:","• Mẫu 1: Có peak hấp thụ rất mạnh ở 1740 cm⁻¹ (C=O) và peak ở 1240 cm⁻¹ (C–O), KHÔNG có peak hấp thụ ở vùng 2500 – 3600 cm⁻¹.","• Mẫu 2: Có peak tù, rất rộng đặc trưng trải dài ở vùng 2500 – 3300 cm⁻¹ (O–H acid) và peak mạnh ở 1715 cm⁻¹ (C=O).","• Mẫu 3: Có peak tù, rộng vừa ở 3350 cm⁻¹ (O–H alcohol), KHÔNG có peak hấp thụ của liên kết C=O ở vùng 1700 – 1750 cm⁻¹.","• Mẫu 4: Có peak mạnh ở 1725 cm⁻¹ (C=O) kèm cụm peak đặc trưng ở 2720 – 2820 cm⁻¹ (liên kết C–H của nhóm –CHO).","Hãy xác định số thứ tự mẫu (từ 1 đến 4) lần lượt tương ứng với (X), (Y), (Z), (T) và ghép liền thành một mã số gồm 4 chữ số."],formulas:["Bảng số sóng hấp thụ đặc trưng trên phổ IR (SGK Hoá 11 - Kết nối tri thức - Bài 10)"],inputSpec:"Nhập số tự nhiên có 4 chữ số theo đúng thứ tự X - Y - Z - T (ví dụ: 1234) kèm ảnh chụp giấy giải thích sự ghép nối nhóm chức.",unit:"Mã 4 chữ số (XYZT)",hint:"Tra cứu vùng số sóng của nhóm –COOH (acid), –COO– (ester), –CHO (aldehyde) và –OH (alcohol) trong Bài 10 SGK Kết nối tri thức."},{id:8,code:"11H",name:"Tinh chế Benzoic Acid bằng phương pháp kết tinh",chapter:"Chương 3: Đại cương về Hoá học hữu cơ",lesson:"Bài 11: Phương pháp tách biệt và tinh chế hợp chất hữu cơ",rating:1350,statement:["Để tinh chế benzoic acid (C₆H₅COOH) bằng phương pháp kết tinh lại, người ta hòa tan benzoic acid vào m (gam) nước sôi ở 95°C để tạo thành dung dịch bão hòa, lọc bỏ tạp chất không tan rồi làm lạnh từ từ dung dịch từ 95°C xuống 20°C.","Sau khi quá trình kết tinh hoàn tất ở 20°C, người ta lọc và làm khô thì thu được đúng 32,1 gam tinh thể benzoic acid nguyên chất (C₆H₅COOH khan, không ngậm nước) tách ra.","Biết độ tan của benzoic acid trong 100 gam nước ở 95°C là 6,80 gam và ở 20°C là 0,38 gam. Hãy tính khối lượng nước m (đơn vị: gam) đã dùng để pha dung dịch bão hòa ban đầu."],formulas:["Độ tan S(95°C) = 6,80 g / 100 g H₂O","Độ tan S(20°C) = 0,38 g / 100 g H₂O"],inputSpec:"Nhập khối lượng nước m (đơn vị: gam) kèm ảnh chụp bài giải tính toán theo độ tan.",unit:"gam H₂O (g)",hint:"Xét trong 100 gam H₂O: khi hạ nhiệt độ từ 95°C xuống 20°C thì lượng benzoic acid tách ra là Δm = 6,80 - 0,38 = 6,42 gam. Từ đó dùng quy tắc tam suất cho 32,1 gam kết tinh."},{id:9,code:"11I",name:"Xác định công thức phân tử từ phổ khối lượng (MS)",chapter:"Chương 3: Đại cương về Hoá học hữu cơ",lesson:"Bài 12: Công thức phân tử hợp chất hữu cơ",rating:1300,statement:["Một hợp chất hữu cơ E (chứa C, H, O) thuộc loại ester đơn chức có mùi thơm đặc trưng của trái cây chín. Phân tích định lượng nguyên tố trong E cho kết quả: %m(C) = 62,07%; %m(H) = 10,34%; còn lại là oxygen.","Trên phổ khối lượng (MS) của hợp chất E, tín hiệu mảnh ion phân tử [M]⁺ có giá trị m/z lớn nhất bằng 116.","Hãy lập công thức phân tử của E và tính TỔNG SỐ NGUYÊN TỬ của tất cả các nguyên tố (C, H, O) có trong MỘT phân tử hợp chất E (Cho H = 1; C = 12; O = 16)."],formulas:["Phổ MS: mảnh [M]⁺ có m/z = 116 ⇒ M(E) = 116 g/mol","Công thức: CₓHᵧO₂ ⇒ Tổng số nguyên tử = x + y + z"],inputSpec:"Nhập một số nguyên duy nhất là tổng số nguyên tử (x + y + z) trong một phân tử E kèm ảnh chụp bài giải lập CTPT.",unit:"원자 / nguyên tử",hint:"Tính %m(O) = 100% - 62,07% - 10,34% = 27,59%. Với M = 116, tính x = (116 × 62,07)/(12 × 100); y = (116 × 10,34)/100; z = (116 × 27,59)/(16 × 100). Sau đó cộng x + y + z."},{id:10,code:"11J",name:"Đốt cháy hợp chất hữu cơ & Biện luận cấu tạo",chapter:"Chương 3: Đại cương về Hoá học hữu cơ",lesson:"Bài 12: Công thức phân tử hợp chất hữu cơ (HSG)",rating:1500,statement:["Đốt cháy hoàn toàn 7,4 gam một hợp chất hữu cơ Z (chứa C, H, O) cần dùng vừa đủ 8,6765 lít khí O₂ (đo ở đkc 25°C, 1 bar: 1 mol khí = 24,79 lít). Toàn bộ sản phẩm cháy (chỉ gồm CO₂ và H₂O) được dẫn vào bình đựng dung dịch Ca(OH)₂ dư, thấy khối lượng bình tăng 18,6 gam và xuất hiện 30,0 gam kết tủa CaCO₃.","Trên phổ khối lượng (MS) của Z, peak ion phân tử [M]⁺ có giá trị m/z = 74. Biết dung dịch chất Z làm quỳ tím hóa đỏ và tác dụng được với dung dịch NaHCO₃ giải phóng khí CO₂.","Hãy tính khối lượng muối khan (đơn vị: gam) thu được khi cho 14,8 gam chất Z tác dụng hoàn toàn với dung dịch NaOH vừa đủ (Cho H = 1; C = 12; O = 16; Na = 23; Ca = 40)."],formulas:["CₓHᵧO₂ + (x + y/4 - z/2)O₂ → xCO₂ + (y/2)H₂O","R–COOH + NaOH → R–COONa + H₂O"],inputSpec:"Nhập khối lượng muối sodium thu được (đơn vị: gam, viết dưới dạng số thập phân) kèm ảnh chụp bài giải chi tiết.",unit:"gam muối (g)",hint:"Từ m(CaCO₃) = 30 g ⇒ n(CO₂) = 0,3 mol (13,2 g). Khối lượng bình tăng 18,6 g ⇒ m(H₂O) = 5,4 g (0,3 mol). Với M = 74 ⇒ CTPT của Z là C₃H₆O₂. Vì Z tác dụng với NaHCO₃ nên Z là C₂H₅COOH. Tính khối lượng muối C₂H₅COONa ứng với 14,8 g Z."}],ru={1: "LOCKED", 2: "LOCKED", 3: "LOCKED", 4: "LOCKED", 5: "LOCKED", 6: "LOCKED", 7: "LOCKED", 8: "LOCKED", 9: "LOCKED", 10: "LOCKED"},x0={width:1500,height:1e3,cols:5,rows:2,verifyHashes:{1:"110cbf1de98bd568be8cedf9ac6baee2904815e9ae69573752cb60c5f0ca5e50",2:"0161c643fbc178a307067c562dd6abab3a2560a85521c0bccedeeb0e7be00b67",3:"e5b6a73a12751cff5a8a8de00b6fc03e65d70416ab6cf9a92054ef1cb1beda21",4:"dd8a31c9a361e5f0431531b0419d12453e5880e73cad2cacbb15b0428fa02c82",5:"8d63716a3b8349d7f5c2317891b4c17da362066db95091005ad033cced6aca99",6:"3a6fab449851f93f4a2eb3bf242ffdbf34dfaa3fcad2c6055f119dab1c6706f8",7:"40d34898f256ae4fc149e1830527677cecc89a184421c55ef3c4bce2ffa39e48",8:"4d51cc8d6d1478a3ec1d14a99fa459ddfc62e538294f12cfabc07c4d0612da9d",9:"d35777e0
